---

include:
  - template: 'Workflows/MergeRequest-Pipelines.gitlab-ci.yml'

stages:
  - 🧪 test
  - 📋 lint
  - 🏗 build

variables:
  # Image
  UV_VERSION: "0.12.0"
  PYTHON_VERSION: "3.14"

  # Task runner
  TASK_BIN: "uv run task"

  # Packaging
  PACKAGE_ACCESS_IDENTIFIER: "gitlab-ci"

  # Secrets (set in GitLab CI/CD settings)
  # - PROJECT_ACCESS_TOKEN
  #   - https://gitlab.data.bas.ac.uk/felnne/zap/-/settings/access_tokens
  #   - (name: 'gitlab_ci' scope: 'read_api', role: 'reporter')

image: mcr.microsoft.com/playwright/python:v1.58.0-noble

.before_script_python: &before_script_python
  # setup UV
  - curl -LsSfo uv.tar.gz https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz
  - tar -xzf uv.tar.gz
  - mv uv-x86_64-unknown-linux-gnu/uv uv-x86_64-unknown-linux-gnu/uvx /usr/local/bin
  - uv --version

.before_script_testing: &before_script_testing
  - *before_script_python

  # setup locale for playwright
  - apt-get update
  - apt-get install -y locales
  - sed -i 's/# en_GB.UTF-8 UTF-8/en_GB.UTF-8 UTF-8/' /etc/locale.gen
  - locale-gen
  - export LANG=en_GB.UTF-8
  - export LANGUAGE=en_GB:en
  - export LC_ALL=en_GB.UTF-8

  # setup app deps (audit run to avoid installing vulnerable deps)
  - uv audit --frozen
  - uv sync --frozen --all-groups --python $PYTHON_VERSION

# Jobs

pytest:
  stage: 🧪 test
  needs: []
  before_script:
    - *before_script_testing
  script:
    - $TASK_BIN ci-test
  artifacts:
    when: always
    reports:
      junit: test-results.xml
    expire_in: 1 month
  rules:
    -
      changes:
        - 'src/**/*.py'
        - 'tests/**/*.py'
        - 'pyproject.toml'
        - 'uv.lock'
      if: '$CI_COMMIT_BRANCH != "streamlit" && $CI_COMMIT_TAG == null'

ruff:
  stage: 📋 lint
  needs: []
  before_script:
    - *before_script_python
  script:
    - $TASK_BIN lint
    - $TASK_BIN format --check
  rules:
    -
      changes:
        - '**/*.py'
      if: '$CI_COMMIT_BRANCH != "streamlit" && $CI_COMMIT_TAG == null'

vulnerabilities:
  stage: 📋 lint
  needs: []
  before_script:
    - *before_script_python
  script:
    - $TASK_BIN audit
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    -
      changes:
        - 'uv.lock'
      if: '$CI_COMMIT_BRANCH != "streamlit" && $CI_COMMIT_TAG == null'

markdown:
  stage: 📋 lint
  needs: []
  before_script:
    - *before_script_python
  script:
    - $TASK_BIN markdown
  rules:
    -
      changes:
        - 'README.md'
        - 'docs/**/*.md'
      if: '$CI_COMMIT_BRANCH != "streamlit" && $CI_COMMIT_TAG == null'

build:
  stage: 🏗 build
  needs: []
  before_script:
    - *before_script_python
  script:
    - $TASK_BIN build
  artifacts:
    paths:
      - dist/
    expire_in: 1 month
  rules:
    -
      changes:
        - '**/*.py'
        - 'pyproject.toml'
        - 'uv.lock'
      if: '$CI_COMMIT_BRANCH != "streamlit" || $CI_COMMIT_TAG != null'
