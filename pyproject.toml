[project]
name = "zap"
version = "0.24.0"
description = "A prototype metadata editor for MAGIC discovery and administration metadata."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Felix Fennell", email = "felnne@bas.ac.uk" }
]
requires-python = ">=3.14"
dependencies = [
    "lantern==0.14.0.post167",
    "streamlit>=1.57.0",
]

[dependency-groups]
dev = [
    "dunamai>=1.26.0",
    "environs>=15.1.0",
    "pymarkdownlnt>=0.9.35",
    "ruff>=0.15.4",
    "taskipy>=1.14.1",
    "watchdog>=6.0.0",
    {include-group = "test"},
]
test = [
    "pytest>=9.0.2",
    "pytest-env>=1.7.0",
    "pytest-playwright>=0.8.0",
    "pytest-random-order>=1.2.0",
]

[tool.uv.exclude-newer-package]
lantern = false  # GitLab hosted packages don't support publish times

[tool.uv.sources]
lantern = { index = "lantern" }

[[tool.uv.index]]
name = "self"
url = "https://gitlab.data.bas.ac.uk/api/v4/projects/1159/packages/pypi/simple"
publish-url = "https://gitlab.data.bas.ac.uk/api/v4/projects/1159/packages/pypi"
explicit = true

[[tool.uv.index]]
name = "lantern"
url = "https://gitlab.data.bas.ac.uk/api/v4/projects/1355/packages/pypi/simple"

[tool.taskipy.variables]
docs_targets = "docs/ README.md CHANGELOG.md"
targets = "src/ tasks/ tests/"

[tool.taskipy.tasks]
# generic dev
build = { cmd = "uv build", help = "Build app package" }
format = { cmd = "ruff format {targets}", help = "Format app", use_vars = true }
lint = { cmd = "ruff check {targets}", help = "Lint app", use_vars = true }
markdown = { cmd = "pymarkdown scan --recurse {docs_targets}", help = "Lint docs", use_vars = true }
pre-commit = { cmd = "pre-commit run --all-files", help = "Run pre-commit hooks on all files" }
test = { cmd = "pytest", help = "Run tests" }
test-reset = { cmd = "pytest --cache-clear", help = "Reset pytest cache and run tests" }
audit = { cmd = "uv audit --frozen", help = "Check for insecure dependencies" }
outdated = { cmd = "uv tree --all-groups --outdated --depth=1", help = "List outdated directed dependencies" }
# CI
ci-test = { cmd = "pytest -o junit_family=xunit2 --junitxml=test-results.xml --continue-on-collection-errors", help = "Called by CI", use_vars = true }
# app dev
env-init = { cmd = "op inject --in-file resources/dev/.env.tpl --out-file .env", help = "Initialise env file" }
release = { cmd = "python -m tasks.release", help = "Prepapre app release" }
# app
version = { cmd = "uv version", help = "Show app version" }
run = { cmd = "python tasks/run.py", help = "Run app" }

[tool.ruff]
src = ["src"]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
#    A | builtins (variables named after builtin names)
#  ANN | annotations (type hints)
#    B | bug-bear (bad code)
#   B9 | bug-bear opinionated (additional bad code)
#  BLE | blind except
#  C90 | mccabe (code complexity)
#   C4 | comprehensions (list/dict/set comprehensions)
#  COM | commas (for diffs)
#    D | pydocstyle (docstring)
#  DTZ | datetimez (date/time)
#    E | pycodestyle errors (PEP8)
#   EM | errmsg (exceptions)
#  ERA | eraticate (comments)
#    F | pyflakes (invalid/bad code)
#   FA | future-annotations (type hints)
# FURB | refurb
#    I | isort (import ordering)
#  INT | flake8-gettext
#  ISC | implicit-str-concat
#    G | logging-format
#  LOG | logging
#    N | pep8-naming (PEP8)
# PERF | performance
#  PIE | misc rules
#   PL | pylint
#   PT | pytest-style (tests)
#  PTH | use-pathlib (old syntax)
#  PYI | type hints
#  RET | return (return statements)
#  RUF | ruff (other)
#    S | bandit (static security)
#  SIM | simplicity (code complexity)
#   TC | type-checking
#   TD | todos (comments)
#  TID | tidy-imports
#  TRY | tryceratops (exceptions)
#   UP | pyupgrade (old syntax)
#    W | pycodestyle warnings (PEP8)
#  YTT | flake8-2020 (sys.version)
select = ["A", "ANN", "B", "B9", "BLE", "C90", "C4", "COM", "D", "DTZ", "E", "EM", "ERA", "F", "FA", "FURB", "I", "INT", "ISC", "G", "LOG", "N", "PERF", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RUF", "S", "SIM", "TC", "TD", "TID", "TRY", "UP", "W", "YTT"]

# COM812 | missing trailing comma (will force verbose function signatures/calls)
#   D100 | for avoding module level docstrings
#   D104 | for avoding package level docstrings
#   D203 | for requring blank line before classes (which looks silly)
#   D212 | for docstring requring multi-line comments to start on first line (which looks silly)
#   D401 | for requring imperative mood in docstrings (finally had enough, too annoying)
#   D402 | for docstring that can't resemble their signatures (despite them being completely different)
#   D413 | for blank line after last section in docblock (rule confict and silly)
#   E501 | for bug-bear compatibility (as B905 overrides line length checks)
#  PT001 | for `@pytest.fixture` parentheses (as it's unstable/unreliable)
#  PT023 | for `@pytest.mark.cov` parentheses (as it's unstable/unreliable)
#  TD002 | for TODOs without an author (as an issue should assign ownership)
ignore = ["COM812", "D100", "D104", "D107", "D203", "D212", "D401", "D402", "D413", "E501", "PT001", "PT023", "TD002"]

[tool.ruff.lint.per-file-ignores]
#   tests/*   | ANN201 | ignore public functions
#   tests/*   | ANN401 | ignore use of 'Any' type
#   tests/*   |   S101 | ignore use of assert
"tests/*" = ["ANN201", "ANN401", "D401", "S101"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-unused-arguments]
# Ignore unused variadic argument, like *args and **kwargs.
ignore-variadic-names = true

[tool.pymarkdown]
plugins.md013.line_length = 120
plugins.md013.code_blocks = false
plugins.md014.enabled = false
extensions.markdown-extended-autolinks.enabled = true

[tool.pytest_env]
# Test encryption and signing keys are not sensitive
ZAP_ADMIN_METADATA_ENCRYPTION_KEY_PRIVATE = "{\"kty\":\"EC\",\"kid\":\"bas_metadata_testing_encryption_key\",\"alg\":\"ECDH-ES+A128KW\",\"crv\":\"P-256\",\"x\":\"kYiwq6MW8lGN6PB2csVMuMRcISVk5eNUpGkjM-mm8QY\",\"y\":\"raOTT2xAQhHFKhPHy338L8Ql0hvgsDtHwtEc8pCOf2Q\",\"d\":\"2lBuUtJK2TcV_b4B-bDCPnRVAqMnYvnLZ41IUguprs8\"}"
ZAP_ADMIN_METADATA_SIGNING_KEY_PRIVATE = "{\"kty\":\"EC\",\"kid\":\"bas_metadata_testing_signing_key\",\"alg\":\"ES256\",\"crv\":\"P-256\",\"x\":\"FzxBM1ZPO5W2bYlhT9AjZUKz5_oH5vIh4_k4aEZ64rM\",\"y\":\"vmK5PWOoIA9eO0ntLh37AMpVODyj0NWf842FwoN-GRs\",\"d\":\"FdxFSRF2zAAfn7_GaDk81T8PdBGlzZpRtxd10-kc4PE\"}"

[tool.pytest.ini_options]
# --strict-markers | fail if unknown markers are used
# --random-order   | run tests in random order
# -x               | stop after first failure [Overriden in CI]
# --ff             | run failed tests first
addopts = "--strict-markers --random-order -x --ff"
markers = [
    "cov: coverage checks (deselect with '-m \"not cov\"')",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.13.0"]
build-backend = "uv_build"
